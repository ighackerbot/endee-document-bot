version: "3.9"

services:
  # ── Endee Vector Database ────────────────────────────────
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-server
    ports:
      - "8080:8080"
    volumes:
      - endee-data:/data
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      NDD_NUM_THREADS: 0
      NDD_AUTH_TOKEN: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dochat-backend
    ports:
      - "8000:8000"
    environment:
      ENDEE_HOST: "http://endee:8080"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      endee:
        condition: service_healthy
    restart: unless-stopped

volumes:
  endee-data:
  uploads-data:
