services:
  # ── Endee Vector DB ──────────────────────────────────────
  # Runs Endee as a Web Service to avoid Render's Private Service pricing.
  - type: web
    name: endee-vector-db
    env: image
    image:
      url: endeeio/endee-server:latest
    envVars:
      - key: NDD_NUM_THREADS
        value: "0"

  # ── FastAPI Backend (Web Service) ──────────────────────────
  # The public-facing backend that handles file uploads and RAG.
  - type: web
    name: docchat-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: ENDEE_HOST
        value: "http://endee-vector-db.railway.internal:8080"
      - key: GEMINI_API_KEY
        sync: false # You must set this manually in the Render Dashboard
